name: plugin-release

# 发布未签名的商店候选包，并上传到对应的 GitHub Release。
#
# 构建与合并逻辑复用官方工作流，不自己实现：
# 它会在矩阵里每个 runner 各打一个 .dbxp，校验「包未签名 + 包内 manifest 身份跨平台一致
# + artifact 元数据的 sha256/size 与包字节相符」，最后合并成 release-candidates.json 上传。
#
# 注意：只认 `release: published` 事件；建 draft Release 或事后在页面上编辑都不会触发。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 已存在的 Release tag（例如 v0.4.0）
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}

      # 官方工作流只负责装 Node 和 Rust，不装 npm 依赖，所以这里自己 npm ci。
      # Sidecar 在 CI 上用默认的 msvc 工具链构建（runner 自带 MSVC），
      # 从而绕过 backend/rust-toolchain.toml 里为「本机无 MSVC」而固定的 gnu 工具链。
      package-command: >-
        npm ci &&
        npm run build &&
        cargo +stable build --release --manifest-path backend/Cargo.toml &&
        node scripts/package.mjs

      # scripts/package.mjs 的产物目录是 release/（官方默认是 dist/）
      package-path: release/*.dbxp
      metadata-path: release/*.artifact.json

      rust-toolchain: stable
      go-version: '' # 本插件没有 Go 后端，跳过 Go 安装

      # 当前只出 windows-x64：Sidecar 的截图（GDI BitBlt / 分层窗口）、置顶
      # （SetWindowPos）、剪贴板（CF_DIB）、OCR（WinRT）与全局热键（RegisterHotKey）
      # 都是直接的 Win32 调用，且 Cargo.toml 里 windows-sys 目前是无条件依赖，
      # 在 linux/darwin 上根本无法编译。
      #
      # 补齐平台实现（条件编译 + 各平台原生实现）后，在这里加条目即可，其余不用改：
      #   {"runner":"ubuntu-24.04","target":"linux-x64"},
      #   {"runner":"ubuntu-24.04-arm","target":"linux-arm64"},
      #   {"runner":"macos-15-intel","target":"darwin-x64"},
      #   {"runner":"macos-15","target":"darwin-arm64"}
      build-matrix: >-
        {"include":[{"runner":"windows-2022","target":"windows-x64"}]}
